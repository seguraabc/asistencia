
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Control de Asistencia por Cursos</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
    .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
    select, table, input[type="text"] { width: 100%; margin: 10px 0; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f5f5f5; }
    .status-btn { padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; }
    .present { background-color: #4CAF50; color: white; }
    .late { background-color: #FFA726; color: white; }
    .absent { background-color: #f44336; color: white; }
    .ap { background-color: #9C27B0; color: white; }
    .no-class { background-color: #607D8B; color: white; }
    .submit-btn { background-color: #2196F3; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; }
    .submit-btn:hover { background-color: #1976D2; }
    .attendance-cell { min-width: 120px; }
    .course-form { display: flex; gap: 10px; }
    .course-form input { flex: 1; }
  </style>
</head>
<body>
  <h1>Control de Asistencia por Cursos</h1>
  
  <div class="section">
    <h2>Configuración de Cursos</h2>
    <form class="course-form" id="courseForm">
      <input type="text" id="courseName" placeholder="Nombre del curso" required>
      <input type="text" id="sheetUrl" placeholder="URL del Google Sheet" required>
      <button type="submit">Agregar Curso</button>
    </form>
    
    <select id="courseSelect">
      <option value="">Seleccionar curso...</option>
    </select>
  </div>
  
  <div class="section" id="asistenciaSection">
    <h2>Control de Asistencia</h2>
    <select id="grupoSelect">
      <option value="">Seleccionar grupo...</option>
    </select>
    <div id="asistenciaContainer"></div>
    <button class="submit-btn" onclick="guardarAsistencia()">Guardar Asistencia</button>
  </div>

  <script>
    // URL de despliegue de tu aplicación web
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyG0tTJPjZh98CyAjWQ9ZitKBt9vzq07nNeJUnuSr9J120W932qRpaO7tkwZ2KqwGFTPg/exec';
    
    // Almacenamiento local para cursos
    const COURSE_KEY = 'attendance_courses';
    let courses = JSON.parse(localStorage.getItem(COURSE_KEY) || '[]');
    let currentCourse = null;
    let currentSheet = '';
    let todayCol = 0;

    // Inicializar UI
    document.addEventListener('DOMContentLoaded', () => {
      renderCourses();
      
      // Manejar formulario de cursos
      document.getElementById('courseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('courseName').value.trim();
        const url = document.getElementById('sheetUrl').value.trim();
        
        if (name && url) {
          courses.push({ name, url });
          localStorage.setItem(COURSE_KEY, JSON.stringify(courses));
          renderCourses();
          this.reset();
        }
      });
      
      // Manejar selección de curso
      document.getElementById('courseSelect').addEventListener('change', function() {
        const selected = this.value;
        if (!selected) return;
        
        currentCourse = courses.find(c => c.name === selected);
        if (currentCourse) {
          fetchGroups(currentCourse.url);
        }
      });
    });

    function renderCourses() {
      const select = document.getElementById('courseSelect');
      select.innerHTML = '<option value="">Seleccionar curso...</option>';
      
      courses.forEach(course => {
        const option = document.createElement('option');
        option.value = course.name;
        option.textContent = course.name;
        select.appendChild(option);
      });
    }

    function fetchGroups(sheetUrl) {
      fetch(`${SCRIPT_URL}?sheetUrl=${encodeURIComponent(sheetUrl)}&sheetAction=listSheets`)
        .then(response => response.json())
        .then(data => {
          const select = document.getElementById('grupoSelect');
          select.innerHTML = '<option value="">Seleccionar grupo...</option>';
          
          data.sheets.forEach(sheet => {
            const option = document.createElement('option');
            option.value = sheet;
            option.textContent = sheet;
            select.appendChild(option);
          });
        })
        .catch(error => {
          console.error('Error al cargar grupos:', error);
          alert('Error al conectar con el Google Sheet. Verifique la URL y permisos.');
        });
    }

    // Cargar estudiantes y asistencia
    document.getElementById('grupoSelect').addEventListener('change', (e) => {
      currentSheet = e.target.value;
      if (!currentSheet || !currentCourse) return;
      
      fetch(`${SCRIPT_URL}?sheetUrl=${encodeURIComponent(currentCourse.url)}&sheet=${currentSheet}`)
        .then(response => response.json())
        .then(data => {
          mostrarAsistencia(data.estudiantes, data.fecha);
        })
        .catch(error => {
          console.error('Error al cargar asistencia:', error);
          alert('Error al cargar datos de asistencia. Intente nuevamente.');
        });
    });

    function mostrarAsistencia(estudiantes, fecha) {
      const container = document.getElementById('asistenciaContainer');
      container.innerHTML = '';
      
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      thead.innerHTML = `<tr><th>Nombre</th><th>Última Asistencia</th><th>Acciones</th></tr>`;
      table.appendChild(thead);
      
      const tbody = document.createElement('tbody');
      estudiantes.forEach(estudiante => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${estudiante.nombre}</td>
          <td class="attendance-cell">${estudiante.ultimoEstado || 'No registrado'}</td>
          <td>
            <button class="status-btn present" onclick="cambiarEstado(this, '${estudiante.nombre}', 'P')">P</button>
            <button class="status-btn late" onclick="cambiarEstado(this, '${estudiante.nombre}', 'T')">T</button>
            <button class="status-btn absent" onclick="cambiarEstado(this, '${estudiante.nombre}', 'A')">A</button>
            <button class="status-btn ap" onclick="cambiarEstado(this, '${estudiante.nombre}', 'AP')">AP</button>
            <button class="status-btn no-class" onclick="cambiarEstado(this, '${estudiante.nombre}', 'X')">X</button>
          </td>
        `;
        tbody.appendChild(row);
      });
      
      table.appendChild(tbody);
      container.appendChild(table);
      
      // Mostrar fecha actual
      container.insertAdjacentHTML('afterbegin', `<h3>Fecha actual: ${fecha}</h3>`);
    }

    function cambiarEstado(btn, nombre, estado) {
      const row = btn.closest('tr');
      const statusCell = row.querySelector('.attendance-cell');
      
      // Resetear todos los botones
      row.querySelectorAll('.status-btn').forEach(b => {
        b.classList.remove('present', 'late', 'absent', 'ap', 'no-class');
      });
      
      // Establecer nuevo estado según código
      switch (estado) {
        case 'P': 
          statusCell.textContent = 'Presente';
          btn.classList.add('present');
          break;
        case 'T':
          statusCell.textContent = 'Tarde';
          btn.classList.add('late');
          break;
        case 'A':
          statusCell.textContent = 'Ausente';
          btn.classList.add('absent');
          break;
        case 'AP':
          statusCell.textContent = 'Ausente Profesor';
          btn.classList.add('ap');
          break;
        case 'X':
          statusCell.textContent = 'Sin Clases';
          btn.classList.add('no-class');
          break;
      }
      
      // Almacenar estado temporalmente
      if (!window.asistenciaData) window.asistenciaData = {};
      window.asistenciaData[nombre] = estado;
    }

    function guardarAsistencia() {
      if (!window.asistenciaData || !currentSheet || !currentCourse) {
        alert('No hay cambios para guardar');
        return;
      }
      
      const fecha = new Date().toISOString().split('T')[0].split('-').join('/'); // Formato dd/MM/yyyy
      
      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sheetUrl: currentCourse.url,
          sheet: currentSheet,
          data: window.asistenciaData,
          fecha: fecha
        })
      })
      .then(response => response.json())
      .then(result => {
        alert(result.message || 'Error al guardar');
        if (result.success) {
          // Recargar datos actuales
          document.getElementById('grupoSelect').dispatchEvent(new Event('change'));
          delete window.asistenciaData;
        }
      })
      .catch(error => {
        console.error('Error al guardar:', error);
        alert('Error de red al guardar la asistencia. Intente nuevamente.');
      });
    }
  </script>
</body>
</html>
